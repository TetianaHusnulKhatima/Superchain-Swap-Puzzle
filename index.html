<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>9. Swap Puzzle</title><style>body{background:#0b0e14;color:#fff;text-align:center;font-family:sans-serif;}button{background:#0052FF;color:#fff;border:none;padding:15px;margin:5px;cursor:pointer;}</style></head>
<body>
<h1>9. Superchain Swap Puzzle</h1>
<h2>Баланс ETH: <span id="e">1.0</span> | USDC: <span id="u">0</span></h2>
<button onclick="swap()">Своп ETH -> USDC</button>
<script>
let eth=1.0, usdc=0;
function swap() {
    if(eth >= 0.1) { eth -= 0.1; usdc += 300; document.getElementById('e').innerText=eth.toFixed(1); document.getElementById('u').innerText=usdc; }
}
</script>
</body>
</html>
